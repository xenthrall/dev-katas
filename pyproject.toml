[project]
name = "dev-katas"
version = "0.2.0"
description = "Deliberate coding katas, Python syntax reference hub, and live-interview drills without AI crutches."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.2",
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "questionary>=2.1.1",
    "requests>=2.34.2",
    "rich>=15.0.0",
    "textual>=8.2.8",
    "uvicorn>=0.54.0",
]

[project.scripts]
katas = "runner:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
only-include = ["runner.py"]

[tool.pytest.ini_options]
testpaths = ["python"]
python_files = ["[0-9][0-9]_*.py", "test_*.py"]
python_functions = ["test_*"]
addopts = "-q"
